<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Two Pong</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin-bottom: 10px;
      }

      canvas {
        border: 3px solid white;
        background: black;
      }

      p {
        color: #bbb;
      }
    </style>
  </head>
  <body>
    <h1>Player Two</h1>
    <canvas id="gameCanvas" width="800" height="400">
      Your browser does not support HTML canvas.
    </canvas>
    <p>Use the Arrow Up and Arrow Down keys to move.</p>
    <script src="game.js"></script>
  </body>
</html>
