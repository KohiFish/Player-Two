<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Two — Pong</title>
  <style>
    body {
      margin: 0;
    }

    canvas {
      display: block;
      width: min(100vw, 800px);
      height: auto;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="450" aria-label="Pong game court"></canvas>

  <script>
    (() => {
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const paddleWidth = 12;
      const paddleHeight = 88;
      const paddleSpeed = 7;
      const keys = new Set();
      const game = {
        leftY: (height - paddleHeight) / 2,
        rightY: (height - paddleHeight) / 2,
        ballX: width / 2,
        ballY: height / 2,
        ballVX: 5,
        ballVY: 3,
        paused: false,
        lastFrame: 0
      };

      function resetBall(direction) {
        game.ballX = width / 2;
        game.ballY = height / 2;
        game.ballVX = 5 * direction;
        game.ballVY = (Math.random() < 0.5 ? -1 : 1) * 3;
      }

      function resetGame() {
        game.leftY = (height - paddleHeight) / 2;
        game.rightY = (height - paddleHeight) / 2;
        game.paused = false;
        resetBall(Math.random() < 0.5 ? -1 : 1);
      }

      function movePaddles() {
        if (keys.has("w")) game.leftY -= paddleSpeed;
        if (keys.has("s")) game.leftY += paddleSpeed;
        if (keys.has("arrowup")) game.rightY -= paddleSpeed;
        if (keys.has("arrowdown")) game.rightY += paddleSpeed;
        game.leftY = Math.max(0, Math.min(height - paddleHeight, game.leftY));
        game.rightY = Math.max(0, Math.min(height - paddleHeight, game.rightY));
      }

      function update() {
        if (game.paused) return;
        movePaddles();

        game.ballX += game.ballVX;
        game.ballY += game.ballVY;

        if (game.ballY <= 10 || game.ballY >= height - 10) {
          game.ballY = Math.max(10, Math.min(height - 10, game.ballY));
          game.ballVY *= -1;
        }

        const leftPaddleX = 28;
        const rightPaddleX = width - 28 - paddleWidth;
        if (
          game.ballVX < 0 &&
          game.ballX - 10 <= leftPaddleX + paddleWidth &&
          game.ballX - 10 >= leftPaddleX &&
          game.ballY >= game.leftY - 10 &&
          game.ballY <= game.leftY + paddleHeight + 10
        ) {
          game.ballX = leftPaddleX + paddleWidth + 10;
          game.ballVX = Math.abs(game.ballVX) * 1.05;
          game.ballVY += ((game.ballY - (game.leftY + paddleHeight / 2)) / (paddleHeight / 2)) * 1.5;
        }

        if (
          game.ballVX > 0 &&
          game.ballX + 10 >= rightPaddleX &&
          game.ballX + 10 <= rightPaddleX + paddleWidth &&
          game.ballY >= game.rightY - 10 &&
          game.ballY <= game.rightY + paddleHeight + 10
        ) {
          game.ballX = rightPaddleX - 10;
          game.ballVX = -Math.abs(game.ballVX) * 1.05;
          game.ballVY += ((game.ballY - (game.rightY + paddleHeight / 2)) / (paddleHeight / 2)) * 1.5;
        }

        if (game.ballX < 0) {
          resetBall(-1);
        } else if (game.ballX > width) {
          resetBall(1);
        }
      }

      function draw() {
        context.fillStyle = "#000";
        context.fillRect(0, 0, width, height);

        context.setLineDash([10, 12]);
        context.strokeStyle = "#444";
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(width / 2, 0);
        context.lineTo(width / 2, height);
        context.stroke();
        context.setLineDash([]);

        context.fillStyle = "#fff";
        context.fillRect(28, game.leftY, paddleWidth, paddleHeight);
        context.fillRect(width - 28 - paddleWidth, game.rightY, paddleWidth, paddleHeight);

        context.beginPath();
        context.arc(game.ballX, game.ballY, 10, 0, Math.PI * 2);
        context.fillStyle = "#fff";
        context.fill();

        if (game.paused) {
          context.fillStyle = "#fff";
          context.font = "24px sans-serif";
          context.textAlign = "center";
          context.fillText("Paused", width / 2, height / 2);
        }
      }

      function frame(timestamp) {
        if (timestamp - game.lastFrame >= 1000 / 60) {
          update();
          draw();
          game.lastFrame = timestamp;
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowup", "arrowdown", " "].includes(key)) event.preventDefault();
        if (key === " " && !event.repeat) game.paused = !game.paused;
        keys.add(key);
      });

      window.addEventListener("keyup", (event) => keys.delete(event.key.toLowerCase()));
      window.addEventListener("blur", () => keys.clear());
      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "r" && !event.repeat) resetGame();
      });

      draw();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
